name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queuemanager_test
          POSTGRES_USER: queuemanager
          POSTGRES_PASSWORD: queuemanager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuemanager -d queuemanager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://queuemanager:queuemanager@localhost:5432/queuemanager_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
